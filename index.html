<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>Aplicación de TODO List</title>
</head>
<body>
    <div class="container">
        <h1 id="titulo">Lista de tareas</h1>
        <div class="input-group">
            <input type="text" 
            id="tareaInput" 
            class="inputText"
             placeholder="Escriba una nueva tarea...">
            <button id="agregarBtn">Agregar</button>
        </div> 
        <div id="mensajeError" class="mensaje-error">Escriba una tarea antes de agregarla.</div>
        <ul id="listaTareas"></ul>
        <div id="mensajeVacio" class="mensaje-vacio">No hay tareas en la lista.</div>
    </div>
    <script src="scripts/script.js"></script>
</body>
</html>
